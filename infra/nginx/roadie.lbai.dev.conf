# /etc/nginx/sites-available/roadie.lbai.dev (link em sites-enabled). Certificado emitido pelo certbot.
# Containers em /opt/roadie (docker-compose.vps.yml): console 127.0.0.1:3012, API 127.0.0.1:8012.
server {
    listen 80;
    server_name roadie.lbai.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name roadie.lbai.dev;

    ssl_certificate     /etc/letsencrypt/live/roadie.lbai.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roadie.lbai.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    client_max_body_size 5m;

    # API: prefixo /api removido (barra final no proxy_pass). SSE sem buffer.
    location /api/ {
        proxy_pass         http://127.0.0.1:8012/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
