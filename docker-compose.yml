# Roadie — ambiente local
# Sobe banco, API e console web com um único comando:
#   docker compose up --build
#
# Portas no host vêm do .env (POSTGRES_PORT, API_PORT, WEB_PORT).

name: roadie

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roadie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roadie}
      POSTGRES_DB: ${POSTGRES_DB:-roadie}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - roadie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roadie} -d ${POSTGRES_DB:-roadie}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-roadie}:${POSTGRES_PASSWORD:-roadie}@db:5432/${POSTGRES_DB:-roadie}
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/roadie:/app/backend/roadie
      - ./data:/app/data:ro
    command: ["uvicorn", "roadie.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  roadie_pgdata:
